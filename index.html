<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Liquid Chrome — OPUS 5.5</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1080px;
        overflow: hidden; background: #000;
      }
      #root {
        width: 100%; height: 100%;
        position: relative;
      }
      #gl {
        display: block;
        width: 1080px; height: 1080px;
        position: absolute; inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1080"
      data-no-timeline
    >
      <canvas id="gl" class="clip" data-start="0" data-duration="6" data-track-index="0" width="1080" height="1080"></canvas>
    </div>

    <script type="module">
      import * as THREE from "three";

      const W = 1080, H = 1080;
      const DURATION = 6;
      const FPS = 60;
      const FRAMES = DURATION * FPS;

      // ---------------------------------------------------------------------
      // 1. SDF ATLAS — bake "OPUS 5.5" outlines into a 2048x512 distance field
      // ---------------------------------------------------------------------
      const ATLAS_W = 2048, ATLAS_H = 512;

      function glyphPolylines(g, sc) {
        const cmds = g.o.replace(/,/g, " ").split(/\s+/).filter(Boolean);
        const paths = [];
        let cur = null, curPt = [0, 0], i = 0;
        while (i < cmds.length) {
          const c = cmds[i];
          if (c === "m") {
            const x = +cmds[i + 1] * sc, y = +cmds[i + 2] * sc;
            cur = { pts: [[x, y]] }; paths.push(cur); curPt = [x, y]; i += 3;
          } else if (c === "l") {
            const x = +cmds[i + 1] * sc, y = +cmds[i + 2] * sc;
            if (cur) cur.pts.push([x, y]);
            curPt = [x, y]; i += 3;
          } else if (c === "q" || c === "b") {
            let px, py;
            const n = c === "q" ? 8 : 10;
            const [x0, y0] = curPt;
            if (c === "q") {
              const cx = +cmds[i + 1] * sc, cy = +cmds[i + 2] * sc;
              px = +cmds[i + 3] * sc; py = +cmds[i + 4] * sc; i += 5;
              for (let k = 1; k <= n; k++) {
                const t = k / n, mt = 1 - t;
                cur.pts.push([mt * mt * x0 + 2 * mt * t * cx + t * t * px,
                              mt * mt * y0 + 2 * mt * t * cy + t * t * py]);
              }
            } else {
              const c1x = +cmds[i + 1] * sc, c1y = +cmds[i + 2] * sc;
              const c2x = +cmds[i + 3] * sc, c2y = +cmds[i + 4] * sc;
              px = +cmds[i + 5] * sc; py = +cmds[i + 6] * sc; i += 7;
              for (let k = 1; k <= n; k++) {
                const t = k / n, mt = 1 - t;
                cur.pts.push([
                  mt ** 3 * x0 + 3 * mt * mt * t * c1x + 3 * mt * t * t * c2x + t ** 3 * px,
                  mt ** 3 * y0 + 3 * mt * mt * t * c1y + 3 * mt * t * t * c2y + t ** 3 * py,
                ]);
              }
            }
            curPt = [px, py];
          } else { i++; }
        }
        paths.forEach((p) => { if (p.pts.length) p.pts.push(p.pts[0].slice()); });
        return paths;
      }

      async function buildSDF() {
        const font = await (await fetch("./assets/helvetiker_bold.typeface.json")).json();
        const TEXT = "OPUS 5.5";
        const SIZE = 0.52, SC = SIZE / 1000, TRACK = -0.04;

        let penX = 0;
        const glyphs = [];
        for (const ch of TEXT) {
          const g = font.glyphs[ch];
          if (!g || !g.o) { penX += 0.30; continue; }
          const paths = glyphPolylines(g, SC);
          glyphs.push({ ch, paths, penX, advance: g.ha * SC });
          penX += g.ha * SC + TRACK * SIZE;
        }
        const totalW = penX, xOff = -totalW / 2, capH = 1000 * SC;
        const s = Math.min(ATLAS_W / (totalW * 1.06), ATLAS_H / (capH * 1.9));
        const cx = ATLAS_W / 2, cy = ATLAS_H / 2;

        const cv = document.createElement("canvas");
        cv.width = ATLAS_W; cv.height = ATLAS_H;
        const ctx = cv.getContext("2d", { willReadFrequently: true });
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, ATLAS_W, ATLAS_H);
        ctx.fillStyle = "#fff";
        for (const gl of glyphs) {
          ctx.beginPath();
          for (const p of gl.paths) {
            p.pts.forEach(([x, y], idx) => {
              const px = cx + (x + gl.penX + xOff) * s;
              const py = cy - y * s;
              idx ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
            });
            ctx.closePath();
          }
          ctx.fill("evenodd");   // fill PER GLYPH — beginPath() discards the previous path
        }
        const data = ctx.getImageData(0, 0, ATLAS_W, ATLAS_H).data;
        const N = ATLAS_W * ATLAS_H;
        const inside = new Uint8Array(N);
        for (let i = 0; i < N; i++) inside[i] = data[i * 4] > 127 ? 1 : 0;

        const INF = 1e9;
        const chamfer = (seed) => {
          const D = new Float32Array(N);
          for (let i = 0; i < N; i++) D[i] = seed[i] ? 0 : INF;
          for (let y = 0; y < ATLAS_H; y++) {
            for (let x = 0; x < ATLAS_W; x++) {
              const i = y * ATLAS_W + x; if (D[i] === 0) continue;
              let d = D[i];
              if (x > 0) d = Math.min(d, D[i - 1] + 3);
              if (y > 0) d = Math.min(d, D[i - ATLAS_W] + 3);
              if (x > 0 && y > 0) d = Math.min(d, D[i - ATLAS_W - 1] + 4);
              if (x < ATLAS_W - 1 && y > 0) d = Math.min(d, D[i - ATLAS_W + 1] + 4);
              D[i] = d;
            }
          }
          for (let y = ATLAS_H - 1; y >= 0; y--) {
            for (let x = ATLAS_W - 1; x >= 0; x--) {
              const i = y * ATLAS_W + x; if (D[i] === 0) continue;
              let d = D[i];
              if (x < ATLAS_W - 1) d = Math.min(d, D[i + 1] + 3);
              if (y < ATLAS_H - 1) d = Math.min(d, D[i + ATLAS_W] + 3);
              if (x < ATLAS_W - 1 && y < ATLAS_H - 1) d = Math.min(d, D[i + ATLAS_W + 1] + 4);
              if (x > 0 && y < ATLAS_H - 1) d = Math.min(d, D[i + ATLAS_W - 1] + 4);
              D[i] = d;
            }
          }
          return D;
        };
        const dOut = chamfer(inside);                       // distance from outside, 0 inside
        const inverted = new Uint8Array(N);
        for (let i = 0; i < N; i++) inverted[i] = inside[i] ? 0 : 1;
        const dIn = chamfer(inverted);                      // distance from inside, 0 outside

        // Encode distance in WORLD units. Encoding in atlas px capped the far field at
        // 10px = 0.019 world units, which made the SDF nearly flat and read as "inside"
        // everywhere. 0.35 world units (~181 atlas px) covers well past any glyph interior.
        const RANGE_WORLD = 0.35;
        const RANGE_PX = RANGE_WORLD * s;
        const tex = new Uint8Array(N * 4);
        for (let i = 0; i < N; i++) {
          const distPx = (inside[i] ? dIn[i] : dOut[i]) / 3;
          const v = Math.max(0, Math.min(255, Math.round((distPx / RANGE_PX) * 255)));
          tex[i * 4] = v;                       // R: unsigned distance, 0 = surface
          tex[i * 4 + 1] = inside[i] ? 255 : 0; // G: inside mask
          tex[i * 4 + 2] = 0;
          tex[i * 4 + 3] = 255;
        }
        const sdfTex = new THREE.DataTexture(tex, ATLAS_W, ATLAS_H, THREE.RGBAFormat);
        sdfTex.minFilter = THREE.LinearFilter;
        sdfTex.magFilter = THREE.LinearFilter;
        sdfTex.wrapS = sdfTex.wrapT = THREE.ClampToEdgeWrapping;
        sdfTex.needsUpdate = true;

        // per-glyph atlas rects so droplets can target individual letters
        const rects = glyphs.map((g) => {
          let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
          g.paths.forEach((p) => p.pts.forEach(([x, y]) => {
            minX = Math.min(minX, x); maxX = Math.max(maxX, x);
            minY = Math.min(minY, y); maxY = Math.max(maxY, y);
          }));
          const wx = (x) => x + g.penX + xOff;
          // Pad the rect beyond the ink box so edge sampling never bleeds into a
          // neighbouring glyph, and so far-field distance is available all round.
          const PAD = 0.14;
          return {
            ch: g.ch,
            u0: Math.max(0, cx + wx(minX - PAD) * s) / ATLAS_W,
            u1: Math.min(ATLAS_W, cx + wx(maxX + PAD) * s) / ATLAS_W,
            v0: Math.max(0, cy - (maxY + PAD) * s) / ATLAS_H,
            v1: Math.min(ATLAS_H, cy - (minY - PAD) * s) / ATLAS_H,
            cwx: wx((minX + maxX) / 2), cwy: (minY + maxY) / 2,
            hw: (maxX - minX) / 2 + PAD, hh: (maxY - minY) / 2 + PAD,
          };
        });
        return { sdfTex, rects, totalW, capH, xOff, atlasScale: s, ATLAS_W, ATLAS_H };
      }

      // ---------------------------------------------------------------------
      // 2. SHADER — one SDF holds blob, droplets and text; raymarched in a
      //    full-screen pass; chrome shaded from a procedural studio env.
      // ---------------------------------------------------------------------
      const frag = /* glsl */ `
        precision highp float;
        uniform float uT;          // seconds, periodic in 6
        uniform vec2  uRes;
        uniform sampler2D uSDF;
        uniform vec4  uGlyph[7];   // u0,v0,u1,v1 per letter
        uniform vec4  uGlyphC[7];  // centre x,y + half w,h in world units
        uniform int   uGlyphCount;
        uniform float uSmoothK;
        uniform vec3  uCamPos;
        uniform vec3  uCamTarget;
        uniform float uGlint;      // 0..1 glint sweep position, -1 = off
        uniform float uMeshW;      // cross-fade weight real mesh <- SDF text
        uniform float uSeed;

        // ---------- hashing / noise (periodic in 6s) ----------
        float hash11(float p){ p = fract(p*0.1031); p *= p+33.33; p *= p+p; return fract(p); }
        float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }

        float sdBox2(vec2 p, vec2 b, float r){
          vec2 d = abs(p) - b + r;
          return length(max(d,0.0)) + min(max(d.x,d.y),0.0) - r;
        }

        // text SDF sampled from the baked atlas, in world units
        float sdText(vec3 p){
          // glyph slab is 0.12 deep total (prompt), so +-0.06
          float halfDepth = 0.06;
          if (abs(p.z) > halfDepth + 0.25) return abs(p.z) - halfDepth;
          float best = 1e5;     // nearest OUTSIDE distance
          float bestIn = 1e5;   // nearest INSIDE distance
          for (int i = 0; i < 7; i++){
            if (i >= uGlyphCount) break;
            vec4 g  = uGlyph[i];       // u0,v0,u1,v1 atlas rect
            vec4 gc = uGlyphC[i];      // centre x,y, half halfSize x,y (world)
            vec2 rel = vec2(p.x - gc.x, p.y - gc.y);
            if (abs(rel.x) > gc.z*1.5 || abs(rel.y) > gc.w*2.0) continue;

            // world -> atlas uv within this glyph's rect
            float u = g.x + (rel.x/(gc.z*2.0) + 0.5) * (g.z - g.x);
            float v = g.y + (rel.y/(gc.w*2.0) + 0.5) * (g.w - g.y);
            // atlas R = unsigned distance over 0.35 world units; G = inside mask
            vec4 tx = texture2D(uSDF, vec2(u,v));
            float d = tx.r * 0.35;
            if (tx.g > 0.5) bestIn = min(bestIn, d);
            else            best   = min(best, d);
          }
          // Combine properly: inside wins only when it is the nearest surface.
          // A plain min() over signed values lets a far-inside point of another glyph win.
          float dFlat;
          if (bestIn < best) dFlat = -bestIn;
          else if (best < 1e4) dFlat = best;
          else dFlat = 0.35;
          // Standard 2D->3D round extrusion. The previous bespoke bevel added the bevel
          // into the flat distance AND subtracted it again, which stretched the glyphs
          // into vertical "drip legs" instead of a clean slab.
          float dz = abs(p.z) - (halfDepth - 0.03);
          float dSlab = length(vec2(max(dFlat, 0.0), max(dz, 0.0)))
                      + min(max(dFlat, dz), 0.0) - 0.03;
          return dSlab;
        }

        float smin(float a, float b, float k){
          float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
          return mix(b, a, h) - k*h*(1.0-h);
        }

        // ---------- scene SDF ----------
        // uT drives: blob breathe, squash, stretch to droplets, letters, melt
        float sceneSDF(vec3 p, out float matId){
          matId = 0.0;
          float d = 1e5;

          // --- timeline weights (all periodic in 6s) ---
          float t = uT;
          float breathe = 0.03 * sin(t * 3.14159265 / 1.5 * 2.0);
          // squash 1.2-1.4
          float squash = smoothstep(1.2,1.4,t) * (1.0 - smoothstep(1.4,1.6,t));
          // droplets 1.4-2.1
          float dropW = smoothstep(1.4,1.62,t) * (1.0 - smoothstep(2.1,2.5,t));
          // letters 2.2-2.9 -> on until melt
          float letterW = smoothstep(2.2,2.6,t) * (1.0 - smoothstep(4.8,5.2,t));
          float meltW = smoothstep(4.8,5.62,t) * (1.0 - smoothstep(5.62,6.0,t));

          // central blob
          float br = 0.62 * (1.0 + breathe) * (1.0 - 0.10*squash);
          vec3 bp = p;
          bp.x /= (1.0 + 2.4*0.5*dropW);
          float dBlob = (length(bp) - br * (1.0 - 0.4*dropW)) ;
          dBlob = max(dBlob, -(length(p) - (br + 0.35)));

          // 7 droplets (one per glyph), arcing to their letter centres
          float dDrops = 1e5;
          for (int i = 0; i < 7; i++){
            if (i >= uGlyphCount) break;
            vec4 gc = uGlyphC[i];
            float fi = float(i);
            vec3 target = vec3(gc.x, gc.y, 0.0);
            float stagger = fi * 3.0/60.0;              // 3 frames apart at 60fps
            float local = clamp((t - 1.4 - stagger) / 0.7, 0.0, 1.0);
            float e = local*local*(3.0-2.0*local);
            vec3 start = vec3(sin(fi*2.3)*0.1, cos(fi*1.7)*0.1, 0.0);
            vec3 c = mix(start, target, e);
            c.y += 0.2 * sin(3.14159 * e) * 1.07;       // arc 0.2 up, 7% overshoot
            float inkHalf = min(max(gc.z - 0.14, 0.02), max(gc.w - 0.14, 0.02));
                        float dr = mix(0.11, inkHalf*0.55, e);
            dDrops = smin(dDrops, length(p - c) - dr, 0.25);
          }

          // text
          float dText = sdText(p);

          // blend: blob -> droplets -> letters
          d = dBlob;
          d = mix(d, smin(dBlob, dDrops, uSmoothK), smoothstep(0.0, 0.15, dropW));
          d = mix(d, smin(dText, dDrops*step(dropW,0.01), uSmoothK), letterW);
          // melt back to a single blob
          float dMelt = length(p) - br * 0.98;
          d = mix(d, dMelt, meltW);
          matId = mix(1.0, 0.0, letterW);
          return d;
        }

        vec3 calcNormal(vec3 p){
          vec2 e = vec2(0.0015, 0.0);
          float m;
          return normalize(vec3(
            sceneSDF(p+e.xyy,m) - sceneSDF(p-e.xyy,m),
            sceneSDF(p+e.yxy,m) - sceneSDF(p-e.yxy,m),
            sceneSDF(p+e.yyx,m) - sceneSDF(p-e.yyx,m)));
        }

        // ---------- studio environment (reflections) ----------
        vec3 env(vec3 r){
          // black camera-side panel, softboxes, rim strip, plus floor/cyc
          float az = atan(r.x, r.z);
          float el = asin(clamp(r.y, -1.0, 1.0));
          vec3 c = vec3(0.012);
          // overhead softbox
          if (el > 0.55) c += vec3(2.4) * smoothstep(0.55, 0.75, el) * (1.0 - smoothstep(1.2,1.4,abs(az)));
          // upper-left softbox
          float ul = smoothstep(0.35,0.55,el) * (1.0-smoothstep(0.9,1.2,abs(az+0.9)));
          c += vec3(3.0) * ul * 0.35;
          // black flags
          c *= 1.0 - 0.85*smoothstep(0.75,0.9,abs(abs(az)-1.31));
          // rim strip behind, D97757
          float rim = smoothstep(2.4,2.6,abs(az)) * smoothstep(0.30,0.42,el) * (1.0-smoothstep(0.7,0.8,el));
          c += vec3(0.85,0.47,0.34) * rim * 1.4;
          // white cyc behind subject
          c += vec3(0.55) * smoothstep(0.2,0.9,el) * smoothstep(0.6,2.2,abs(az)) * 0.5;
          // floor
          if (el < -0.35) c = mix(c, vec3(0.75), smoothstep(-0.35,-0.9,el) * 0.9);
          // camera-side black panel (dark letter faces)
          if (abs(az) < 0.75 && el > -0.25) c = vec3(0.004);
          return c;
        }

        vec3 shadeChrome(vec3 p, vec3 n, vec3 rd, float glint){
          vec3 v = -rd;
          float ndv = clamp(dot(n, v), 0.0, 1.0);
          vec3 r = reflect(rd, n);
          vec3 refl = env(r);
          // two extra bounces
          vec3 r2 = reflect(r, n); refl = mix(refl, env(r2), 0.25);
          vec3 r3 = reflect(r2, n); refl = mix(refl, env(r3), 0.12);
          // Schlick fresnel, F0 0.92
          float F = 0.92 + 0.08 * pow(1.0 - ndv, 5.0);
          vec3 col = refl * F;
          // glint strip sweep
          float band = smoothstep(0.0, 0.06, glint - (r.x*0.5+0.5)) * (1.0 - smoothstep(0.06, 0.16, glint - (r.x*0.5+0.5)));
          col += vec3(6.0) * band;
          return col;
        }

        void main(){
          vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
          vec3 ro = uCamPos;
          vec3 fw = normalize(uCamTarget - ro);
          vec3 rt = normalize(cross(vec3(0.0, 1.0, 0.0), fw));
          vec3 up = cross(fw, rt);
          // 42deg total fov. The prompt's "30 degree lens" cannot fit the prompt's own
          // text at its own closest dolly: at 30deg and d=5.6 the frame shows 3.00 world
          // units, but "OPUS 5.5" at size 0.52 / -0.04em tracking is 3.135 wide. 42deg
          // also leaves margin for the +-7deg orbit, which foreshortens a flat word.
          float focal = 1.0 / tan(radians(21.0));
          vec3 rd = normalize(fw * focal + rt * uv.x + up * uv.y);
          float t = 0.0, d = 0.0, matId = 0.0;
          for (int i = 0; i < 96; i++){
            vec3 pos = ro + rd*t;
            d = sceneSDF(pos, matId);
            if (d < 0.0008) break;
            t += max(d*0.85, 0.001);
            if (t > 12.0) break;
          }
          vec3 col = vec3(0.0);
          if (d < 0.0015){
            vec3 p = ro + rd*t;
            vec3 n = calcNormal(p);
            col = shadeChrome(p, n, rd, uGlint);
            // contact darkening near the floor
            col *= mix(0.75, 1.0, smoothstep(-0.78, -0.4, p.y));
          } else {
            // background: white floor + soft studio falloff
            float fy = (rd.y > 0.001) ? (-0.8 - ro.y)/rd.y : 1e5;
            if (rd.y < 0.0 && fy < 1e4) {
              vec3 fp = ro + rd*fy;
              float sh = length(fp.xz);
              col = vec3(0.92) * (1.0 - 0.35*smoothstep(0.5, 4.0, sh));
            } else {
              col = vec3(0.62) * (1.0 - 0.5*length(uv));
            }
          }
          // bloom-ish threshold glow
          float lum = dot(col, vec3(0.2126,0.7152,0.0722));
          col += col * smoothstep(1.0, 2.5, lum) * 0.30;
          // tone curve: linear to 0.9 then soft shoulder
          col = col / (1.0 + max(vec3(0.0), col - 0.9));
          // vignette 7%
          float vig = 1.0 - 0.07 * pow(length(uv)*1.25, 2.0);
          col *= vig;
          // grain 1.5% seeded by frame index
          float g = hash21(gl_FragCoord.xy + uSeed*17.0) - 0.5;
          col += g * 0.015;
          gl_FragColor = vec4(pow(max(col, 0.0), vec3(0.4545)), 1.0);
        }
      `;

      // ---------------------------------------------------------------------
      // 3. Boot
      // ---------------------------------------------------------------------
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);

      const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const quadGeo = new THREE.PlaneGeometry(2, 2);
      let material = null;
      const scene = new THREE.Scene();
      const mesh = new THREE.Mesh(quadGeo, new THREE.MeshBasicMaterial());
      scene.add(mesh);

      const build = (async () => {
        const atlas = await buildSDF();
        const glyphRects = [];
        const glyphCentres = [];
        for (let i = 0; i < 7; i++) {
          const g = atlas.rects[i];
          if (!g) { glyphRects.push(new THREE.Vector4(0, 0, 1, 1)); glyphCentres.push(new THREE.Vector4(0, 0, 0.1, 0.1)); continue; }
          glyphRects.push(new THREE.Vector4(g.u0, g.v0, g.u1, g.v1));
          glyphCentres.push(new THREE.Vector4(g.cwx, g.cwy, g.hw, g.hh));
        }
        material = new THREE.ShaderMaterial({
          uniforms: {
            uT: { value: 0 },
            uRes: { value: new THREE.Vector2(W, H) },
            uSDF: { value: atlas.sdfTex },
            uGlyph: { value: glyphRects },
            uGlyphC: { value: glyphCentres },
            uGlyphCount: { value: Math.min(7, atlas.rects.length) },
            uSmoothK: { value: 0.35 },
            uCamPos: { value: new THREE.Vector3(0, 0.15, 5.6) },
            uCamTarget: { value: new THREE.Vector3(0, 0.26, 0) },
            uGlint: { value: -1 },
            uMeshW: { value: 0 },
            uSeed: { value: 0 },
          },
          vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
          fragmentShader: frag,
        });
        mesh.material = material;

        // ---- camera: dolly 5.6->7.2 by 2.6, push 6.95 in hold, back by 5.9;
        //      orbit +-7deg centred on the hold; 6deg above
        function cameraAt(t) {
          const easeInOut = (x) => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
          let dist;
          if (t < 2.6) dist = 5.6 + (7.2 - 5.6) * easeInOut(t / 2.6);
          else if (t < 4.8) dist = 7.2 + (6.95 - 7.2) * easeInOut(Math.min(1, (t - 2.6) / 0.8));
          else dist = 6.95 + (5.6 - 6.95) * easeInOut(Math.min(1, (t - 4.8) / 1.1));
          const orbit = 7 * Math.sin(((t - 2.9) / 1.9) * Math.PI); // centred on hold 2.9-4.8
          const el = 6 * Math.PI / 180;
          const az = orbit * Math.PI / 180;
          return new THREE.Vector3(
            Math.sin(az) * Math.cos(el) * dist,
            Math.sin(el) * dist,
            Math.cos(az) * Math.cos(el) * dist,
          );
        }

        // ---- the renderer entry point: every frame is a pure function of t
        function renderAt(t) {
          t = ((t % DURATION) + DURATION) % DURATION;
          const frame = Math.round(t * FPS);
          // quarter-pixel camera jitter, 4 offsets from frac(t*60)
          const jx = (Math.floor(frame % 4) - 1.5) * 0.25 / W;
          const jy = ((Math.floor(frame % 4) - 1.5) * 0.25) / H;

          const cp = cameraAt(t);
          material.uniforms.uCamPos.value.copy(cp);
          material.uniforms.uCamTarget.value.set(0, 0.26, 0);
          material.uniforms.uT.value = t;
          material.uniforms.uSeed.value = frame;
          // glint sweep 3.3 -> 4.1
          material.uniforms.uGlint.value = (t >= 3.3 && t <= 4.1) ? (t - 3.3) / 0.8 : -1;
          // smooth-min k falls 0.35 -> 0.1 as droplets part
          const dropW = Math.min(1, Math.max(0, (t - 1.4) / 0.22)) * (1 - Math.min(1, Math.max(0, (t - 2.1) / 0.4)));
          material.uniforms.uSmoothK.value = 0.35 + (0.10 - 0.35) * dropW;

          // apply the sub-pixel jitter by nudging projection
          cam.setViewOffset(W, H, jx * W, jy * H, W, H);
          renderer.render(scene, cam);
        }

        window.renderAt = renderAt;
        window.__hf = window.__hf || {};
        window.__ready = true;
        renderAt(0);
        return true;
      })();

      // Standalone (?t=) support: never start requestAnimationFrame when frozen by URL
      const params = new URLSearchParams(location.search);
      if (params.has("t")) {
        build.then(() => {
          const t = parseFloat(params.get("t")) || 0;
          window.renderAt(t);
        });
      } else {
        // HyperFrames adapter path: seek-driven only
        window.addEventListener("hf-seek", (ev) => {
          build.then(() => window.renderAt(ev.detail.time));
        });
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["liquid-chrome"] = build;
      }
    </script>
  </body>
</html>
