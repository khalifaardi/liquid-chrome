<!doctype html>
<html><head><style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script></head><body>
<canvas id="gl" width="1080" height="1080"></canvas>
<script type="module">
import * as THREE from "three";

// Minimal isolate test: only the text SDF, flat-shaded, front-on.
// If this does not read "OPUS 5.5" the glyph sampling maths is wrong.

const src = await (await fetch("./index.html")).text();
// reuse the exact bake + glyph rect code from index.html by evaluating its helpers
// (simpler: re-implement minimal bake here, identical maths)

const font = await (await fetch("./assets/helvetiker_bold.typeface.json")).json();
const ATLAS_W = 2048, ATLAS_H = 512;

function glyphPolylines(g, sc) {
  const cmds = g.o.replace(/,/g, " ").split(/\s+/).filter(Boolean);
  const paths = []; let cur = null, curPt = [0,0], i = 0;
  while (i < cmds.length) {
    const c = cmds[i];
    if (c === "m") { const x=+cmds[i+1]*sc, y=+cmds[i+2]*sc; cur={pts:[[x,y]]}; paths.push(cur); curPt=[x,y]; i+=3; }
    else if (c === "l") { const x=+cmds[i+1]*sc, y=+cmds[i+2]*sc; if(cur) cur.pts.push([x,y]); curPt=[x,y]; i+=3; }
    else if (c === "q" || c === "b") {
      let px,py; const n = c==="q"?8:10; const [x0,y0]=curPt;
      if (c==="q") { const cx=+cmds[i+1]*sc, cy=+cmds[i+2]*sc; px=+cmds[i+3]*sc; py=+cmds[i+4]*sc; i+=5;
        for(let k=1;k<=n;k++){const t=k/n,mt=1-t; cur.pts.push([mt*mt*x0+2*mt*t*cx+t*t*px, mt*mt*y0+2*mt*t*cy+t*t*py]);}
      } else { const c1x=+cmds[i+1]*sc,c1y=+cmds[i+2]*sc,c2x=+cmds[i+3]*sc,c2y=+cmds[i+4]*sc; px=+cmds[i+5]*sc; py=+cmds[i+6]*sc; i+=7;
        for(let k=1;k<=n;k++){const t=k/n,mt=1-t;
          cur.pts.push([mt**3*x0+3*mt*mt*t*c1x+3*mt*t*t*c2x+t**3*px, mt**3*y0+3*mt*mt*t*c1y+3*mt*t*t*c2y+t**3*py]);}
      } curPt=[px,py];
    } else i++;
  }
  paths.forEach(p=>{if(p.pts.length)p.pts.push(p.pts[0].slice());});
  return paths;
}

const TEXT = "OPUS 5.5", SIZE = 0.52, SC = SIZE/1000, TRACK = -0.04;
let penX = 0; const glyphs = [];
for (const ch of TEXT) {
  const g = font.glyphs[ch];
  if (!g || !g.o) { penX += 0.30; continue; }
  const paths = glyphPolylines(g, SC);
  glyphs.push({ ch, paths, penX, advance: g.ha*SC });
  penX += g.ha*SC + TRACK*SIZE;
}
const totalW = penX, xOff = -totalW/2, capH = 1000*SC;
const s = Math.min(ATLAS_W/(totalW*1.06), ATLAS_H/(capH*1.9));
const cx = ATLAS_W/2, cy = ATLAS_H/2;

const cv = document.createElement("canvas"); cv.width=ATLAS_W; cv.height=ATLAS_H;
const ctx = cv.getContext("2d", { willReadFrequently:true });
ctx.fillStyle="#000"; ctx.fillRect(0,0,ATLAS_W,ATLAS_H); ctx.fillStyle="#fff";
for (const gl of glyphs) {
  ctx.beginPath();
  for (const p of gl.paths) p.pts.forEach(([x,y],idx)=>{
    const px=cx+(x+gl.penX+xOff)*s, py=cy-y*s;
    idx?ctx.lineTo(px,py):ctx.moveTo(px,py);
  });
  ctx.closePath();
}
ctx.fill("evenodd");

const data = ctx.getImageData(0,0,ATLAS_W,ATLAS_H).data;
const N = ATLAS_W*ATLAS_H;
const inside = new Uint8Array(N);
for (let i=0;i<N;i++) inside[i] = data[i*4]>127?1:0;

const INF=1e9;
function chamfer(seed){
  const D=new Float32Array(N);
  for(let i=0;i<N;i++) D[i]=seed[i]?0:INF;
  for(let y=0;y<ATLAS_H;y++)for(let x=0;x<ATLAS_W;x++){const i=y*ATLAS_W+x;if(D[i]===0)continue;let d=D[i];
    if(x>0)d=Math.min(d,D[i-1]+3); if(y>0)d=Math.min(d,D[i-ATLAS_W]+3);
    if(x>0&&y>0)d=Math.min(d,D[i-ATLAS_W-1]+4); if(x<ATLAS_W-1&&y>0)d=Math.min(d,D[i-ATLAS_W+1]+4); D[i]=d;}
  for(let y=ATLAS_H-1;y>=0;y--)for(let x=ATLAS_W-1;x>=0;x--){const i=y*ATLAS_W+x;if(D[i]===0)continue;let d=D[i];
    if(x<ATLAS_W-1)d=Math.min(d,D[i+1]+3); if(y<ATLAS_H-1)d=Math.min(d,D[i+ATLAS_W]+3);
    if(x<ATLAS_W-1&&y<ATLAS_H-1)d=Math.min(d,D[i+ATLAS_W+1]+4); if(x>0&&y<ATLAS_H-1)d=Math.min(d,D[i+ATLAS_W-1]+4); D[i]=d;}
  return D;
}
const dOut = chamfer(inside);
const inv = new Uint8Array(N); for(let i=0;i<N;i++) inv[i]=inside[i]?0:1;
const dIn = chamfer(inv);
const RANGE=10;
const tex=new Uint8Array(N*4);
for(let i=0;i<N;i++){
  const distPx=(inside[i]?dIn[i]:dOut[i])/3;
  tex[i*4]=Math.max(0,Math.min(255,Math.round(distPx/RANGE*255)));
  tex[i*4+1]=inside[i]?255:0; tex[i*4+2]=0; tex[i*4+3]=255;
}
const sdfTex=new THREE.DataTexture(tex,ATLAS_W,ATLAS_H,THREE.RGBAFormat);
sdfTex.minFilter=sdfTex.magFilter=THREE.LinearFilter;
sdfTex.wrapS=sdfTex.wrapT=THREE.ClampToEdgeWrapping; sdfTex.needsUpdate=true;

const rects = glyphs.map(g=>{
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  g.paths.forEach(p=>p.pts.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}));
  const wx=x=>x+g.penX+xOff;
  return { ch:g.ch,
    u0:(cx+wx(minX)*s)/ATLAS_W, u1:(cx+wx(maxX)*s)/ATLAS_W,
    v0:(cy-maxY*s)/ATLAS_H,    v1:(cy-minY*s)/ATLAS_H,
    cwx:wx((minX+maxX)/2), cwy:(minY+maxY)/2,
    hw:(maxX-minX)/2, hh:(maxY-minY)/2,
    pxPerWorld: (( (cy-minY*s)/ATLAS_H - (cy-maxY*s)/ATLAS_H )*ATLAS_H) / ((maxY-minY)) };
});

console.log("RECTS", JSON.stringify(rects.map(r=>({ch:r.ch,cwx:+r.cwx.toFixed(3),cwy:+r.cwy.toFixed(3),hw:+r.hw.toFixed(3),hh:+r.hh.toFixed(3),pxPerWorld:+r.pxPerWorld.toFixed(1)}))));

const W=1080,H=1080;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById("gl"),antialias:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W,H,false);

const gR=[],gC=[];
for(let i=0;i<7;i++){const r=rects[i];
  if(!r){gR.push(new THREE.Vector4(0,0,1,1));gC.push(new THREE.Vector4(0,0,0.1,0.1));continue;}
  gR.push(new THREE.Vector4(r.u0,r.v0,r.u1,r.v1));
  gC.push(new THREE.Vector4(r.cwx,r.cwy,r.hw,r.hh));
}

const mat=new THREE.ShaderMaterial({
  uniforms:{uSDF:{value:sdfTex},uGlyph:{value:gR},uGlyphC:{value:gC},uCount:{value:Math.min(7,rects.length)}},
  vertexShader:`void main(){gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`
  precision highp float;
  uniform sampler2D uSDF; uniform vec4 uGlyph[7]; uniform vec4 uGlyphC[7]; uniform int uCount;
  float sdText(vec3 p){
    float halfDepth=0.06;
    float best=1e5;
    for(int i=0;i<7;i++){
      if(i>=uCount) break;
      vec4 g=uGlyph[i]; vec4 gc=uGlyphC[i];
      vec2 rel=vec2(p.x-gc.x, p.y-gc.y);
      if(abs(rel.x)>gc.z*1.5||abs(rel.y)>gc.w*2.0) continue;
      float u=g.x+(rel.x/(gc.z*2.0)+0.5)*(g.z-g.x);
      float v=g.y+(rel.y/(gc.w*2.0)+0.5)*(g.w-g.y);
      vec4 tx=texture2D(uSDF,vec2(u,v));
      float distPx=tx.r*10.0;
      float sgn=tx.g>0.5?-1.0:1.0;
      float pxPerWorld=((g.w-g.y)*512.0)/(gc.w*2.0);
      best=min(best, sgn*(distPx/pxPerWorld));
    }
    return best;
  }
  void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*vec2(1080.,1080.))/1080.;
    vec3 rd=normalize(vec3(uv,-1.6/0.52*3.0));
    vec3 ro=vec3(0.,0.,6.0);
    float t=0.,d=0.;
    for(int i=0;i<128;i++){ d=sdText(ro+rd*t); if(d<0.0006)break; t+=max(d*0.9,0.0005); if(t>14.)break; }
    vec3 col=vec3(0.08);
    if(d<0.001){ col=vec3(0.92); }
    gl_FragColor=vec4(col,1.0);
  }`,
});
const sc=new THREE.Scene();
sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
const cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
renderer.render(sc,cam);
window.__done=true;
</script></body></html>
